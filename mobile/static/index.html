<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No external anything: scripts only from the app itself; WebSockets to whatever relay the user gives (plain ws:
       to an IP, encrypted at application level later). style-src keeps 'unsafe-inline' for xterm.js, which writes
       its theme into a <style> element. blob:/mediastream: are the camera for the QR scanner. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1015">
  <meta name="format-detection" content="telephone=no">
  <title>AgentDeck</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="banner" class="banner" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
