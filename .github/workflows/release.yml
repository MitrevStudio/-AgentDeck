# Every push to main: check → semantic-release decides the next version from the commit messages
# (fix: → patch, feat: → minor, BREAKING CHANGE → major), pushes the tag and creates the GitHub release as a draft →
# the Windows installer is built from that tag, attached to the release, and only then is the release published.
# The installed app updates itself from the latest published release (electron-updater reads its latest.yml), so a
# release must never be public without its installer; a failed build leaves a draft nobody sees.
# The Linux AppImage (experimental) is built alongside and attached to the same release. It does not hold the
# release back: the app does not update itself on Linux, so a release without it misleads no one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/test-remote-state.js
      - run: node scripts/test-resources.js
      - run: node scripts/test-codex-live.js
      - run: node scripts/test-project-sessions.js
      - run: npm run test:limits

  release:
    needs: check
    runs-on: ubuntu-26.04
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The repository does not carry the version; the release tag is the source of truth.
      - run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # gh finds a draft by its tag too (and the tag exists: semantic-release pushed it before creating the release).
      - name: Attach the installer and publish the release
        shell: bash
        run: |
          gh release upload "v$VERSION" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:linux
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build AppImage
        run: npx electron-builder --linux --publish never
      # The release may still be a draft (the Windows job publishes it) or already public: gh finds it by its tag.
      - name: Attach the AppImage
        run: gh release upload "v$VERSION" dist/*.AppImage dist/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
