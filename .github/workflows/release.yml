# Every push to main: check → semantic-release decides the next version from the commit messages
# (fix: → patch, feat: → minor, BREAKING CHANGE → major), pushes the tag and creates the GitHub release as a draft →
# the Windows installer is built from that tag, attached to the release, and only then is the release published.
# The installed app updates itself from the latest published release (electron-updater reads its latest.yml), so a
# release must never be public without its installer; a failed build leaves a draft nobody sees.
# The Linux AppImage (experimental) is built alongside and attached to the same release. It does not hold the
# release back: the app does not update itself on Linux, so a release without it misleads no one.
# The relay's Docker image (host/Dockerfile) goes to the GitHub Container Registry with the same version, and as latest.
# The Android app (mobile/) is built with the same version, signed with the release key from the repository's secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) and attached to the
# same release as AgentDeck-<version>.apk. Like the AppImage it does not hold the release back.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/test-remote-state.js
      - run: node scripts/test-resources.js
      - run: node scripts/test-codex-live.js
      - run: node scripts/test-project-sessions.js
      - run: npm run test:limits
      - run: npm run test:themes
      - run: npm run test:noise
      - run: npm run test:terminal-viewers
      - run: npm run test:desktop-terminals

  release:
    needs: check
    runs-on: ubuntu-26.04
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semrel
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The repository does not carry the version; the release tag is the source of truth.
      - run: npm version "$env:VERSION" --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # gh finds a draft by its tag too (and the tag exists: semantic-release pushed it before creating the release).
      - name: Attach the installer and publish the release
        shell: bash
        run: |
          gh release upload "v$VERSION" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:linux
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build AppImage
        run: npx electron-builder --linux --publish never
      # The release may still be a draft (the Windows job publishes it) or already public: gh finds it by its tag.
      - name: Attach the AppImage
        run: gh release upload "v$VERSION" dist/*.AppImage dist/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-android:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The app bundles src/mesh, whose packages live in the root; nothing of the desktop is built here.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: mobile
      # An update installs only over an app signed with the same key: no key, no release build.
      - name: Release key
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build the signed APK
        working-directory: mobile
        run: npm run apk:release
        env:
          AGENTDECK_VERSION: ${{ needs.release.outputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Check the signature and attach the APK
        run: |
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$apk"
          cp "$apk" "AgentDeck-$VERSION.apk"
          gh release upload "v$VERSION" "AgentDeck-$VERSION.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  docker-relay:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mitrevstudio/agentdeck-relay
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # amd64 and arm64: a VPS or a Raspberry Pi.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MitrevStudio/-AgentDeck
            org.opencontainers.image.title=AgentDeck relay
            org.opencontainers.image.description=Routes mesh traffic between paired AgentDecks; runs nothing of its own
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
