<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title data-i18n="settings.title"></title>
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="settings-dictation.css">
<link rel="stylesheet" href="settings-commands.css">
<script src="../../i18n.js"></script>
</head>
<body>
<form id="form" class="vs" autocomplete="off" novalidate>
  <!-- The tabs down the left: the app's own, then the voice group. Dictation, Dictionary and Read aloud are one
       settings record with one Save (data-group="voice" on their panes); each marks its own unsaved edits. -->
  <nav class="vs-side">
    <div class="vs-brand">
      <div class="logo" id="logo"></div>
      <div class="grow"><h1 data-i18n="settings.title"></h1><p data-i18n="settings.subtitle"></p></div>
    </div>
    <div class="vs-tabs" id="tabs" role="tablist" aria-orientation="vertical">
      <button type="button" role="tab" id="tabGeneral" data-value="general" aria-controls="general"><span data-icon="window"></span><span data-i18n="settings.general"></span></button>
      <button type="button" role="tab" id="tabNetwork" data-value="network" aria-controls="network"><span data-icon="globe"></span><span data-i18n="settings.network"></span></button>
      <div class="vs-group" aria-hidden="true" data-i18n="settings.voice"></div>
      <button type="button" role="tab" id="tabDictation" data-value="dictation" aria-controls="dictation"><span data-icon="mic"></span><span data-i18n="voice.settings.dictation"></span></button>
      <button type="button" role="tab" id="tabDictionary" data-value="dictionary" aria-controls="dictionary"><span data-icon="book"></span><span data-i18n="settings.dictionary"></span></button>
      <button type="button" role="tab" id="tabReadAloud" data-value="readaloud" aria-controls="readaloud"><span data-icon="speaker"></span><span data-i18n="voice.settings.readAloud"></span></button>
      <button type="button" role="tab" id="tabCommands" data-value="commands" aria-controls="commands"><span data-icon="bolt"></span><span data-i18n="settings.commands"></span></button>
    </div>
  </nav>

  <div class="vs-main">
  <div class="vs-panes">
    <!-- General: applied at once, outside Save/Cancel (which are the voice tab's). -->
    <div class="vs-pane" id="general" role="tabpanel" aria-labelledby="tabGeneral">
      <section class="vs-sec">
        <h2><span data-icon="window"></span><span data-i18n="settings.general.appearance"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" id="uiLanguageLabel" data-i18n="settings.general.language"></span>
          <div class="seg" id="uiLanguage" role="radiogroup" aria-labelledby="uiLanguageLabel"></div>

          <span class="vs-label" id="uiThemeLabel" data-i18n="settings.general.theme"></span>
          <div class="seg" id="uiTheme" role="radiogroup" aria-labelledby="uiThemeLabel"></div>
        </div>
      </section>

      <section class="vs-sec">
        <h2><span data-icon="layers"></span><span data-i18n="settings.general.edge"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" data-i18n="settings.general.handle"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="edgeHandle">
              <span><b data-i18n="settings.general.edgeHandle"></b></span>
              <input type="checkbox" id="edgeHandle" class="switch">
            </label>
            <div class="vs-hint" data-i18n="settings.general.edgeHandleHint"></div>
          </div>

          <span class="vs-label" data-i18n="settings.general.dayLabel"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="dayView">
              <span><b data-i18n="settings.general.dayView"></b></span>
              <input type="checkbox" id="dayView" class="switch">
            </label>
            <div class="vs-hint" data-i18n="settings.general.dayViewHint"></div>
          </div>

          <span class="vs-label" data-i18n="settings.general.hotkey"></span>
          <div class="vs-field"><div class="vs-caps" id="edgeHotkey"></div><div class="vs-hint" id="edgeHotkeyHint"></div></div>
        </div>
      </section>

      <section class="vs-sec">
        <h2><span data-icon="terminal"></span><span data-i18n="settings.general.terminal"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" data-i18n="settings.general.windows"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="newWindow">
              <span><b data-i18n="settings.general.newWindow"></b></span>
              <input type="checkbox" id="newWindow" class="switch">
            </label>
            <div class="vs-hint" data-i18n="settings.general.newWindowHint"></div>
          </div>
        </div>
      </section>

      <section class="vs-sec">
        <h2><span data-icon="power"></span><span data-i18n="settings.general.startup"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" data-i18n="settings.general.startupLabel"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="autostart">
              <span><b data-i18n="settings.general.autostart"></b></span>
              <input type="checkbox" id="autostart" class="switch">
            </label>
            <div class="vs-hint" id="autostartHint"></div>
          </div>
        </div>
      </section>

      <section class="vs-sec">
        <h2><span data-icon="download"></span><span data-i18n="settings.updates"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" data-i18n="settings.updates.version"></span>
          <div class="vs-field">
            <div class="vs-upd">
              <span class="vs-ver" id="appVersion"></span>
              <span class="tag" id="updateTag"></span>
              <span class="grow"></span>
              <button type="button" class="btn sm" id="updateCheck"><span data-icon="refresh"></span><span data-i18n="settings.updates.check"></span></button>
              <button type="button" class="btn sm primary" id="updateDownload" hidden><span data-icon="download"></span><span data-i18n="settings.updates.download"></span></button>
              <button type="button" class="btn sm primary" id="updateInstall" hidden><span data-icon="refresh"></span><span data-i18n="settings.updates.install"></span></button>
            </div>
            <div class="vs-progress" id="updateProgress" hidden><i></i></div>
            <div class="vs-hint" id="updateHint" role="status"></div>
          </div>

          <span class="vs-label" data-i18n="settings.updates.automatic"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="autoUpdate">
              <span><b data-i18n="settings.updates.auto"></b></span>
              <input type="checkbox" id="autoUpdate" class="switch">
            </label>
            <div class="vs-hint" data-i18n="settings.updates.autoHint"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="vs-pane" id="dictation" data-group="voice" role="tabpanel" aria-labelledby="tabDictation">
      <section class="vs-sec">
        <h2><span data-icon="mic"></span><span data-i18n="voice.settings.recognition"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" id="providerLabel" data-i18n="voice.settings.provider"></span>
          <div class="seg" id="provider" role="radiogroup" aria-labelledby="providerLabel"></div>

          <label class="vs-label" for="apiKey" data-i18n="voice.settings.apiKey"></label>
          <div class="vs-field">
            <div class="vs-key">
              <input id="apiKey" class="input" type="password" spellcheck="false" autocomplete="new-password">
              <span class="tag" id="keyTag"></span>
            </div>
            <div class="vs-keystate" id="keyState"></div>
            <div class="vs-err" data-err="apiKey"></div>
          </div>

          <label class="vs-label" for="model" data-i18n="voice.settings.model"></label>
          <div class="vs-field"><select id="model" class="select"></select><div class="vs-err" data-err="model"></div></div>

          <label class="vs-label" for="language" data-i18n="voice.settings.language"></label>
          <select id="language" class="select"></select>

          <label class="vs-label" for="mic" data-i18n="voice.settings.mic"></label>
          <select id="mic" class="select"></select>

          <label class="vs-label" for="maxLen" data-i18n="voice.settings.maxLength"></label>
          <div class="vs-field"><select id="maxLen" class="select"></select><div class="vs-hint" id="lengthHint"></div></div>

          <span class="vs-label" data-i18n="voice.settings.paste"></span>
          <label class="vs-toggle" for="clipboard">
            <span><b data-i18n="voice.settings.paste.clipboard"></b><small data-i18n="voice.settings.paste.recommended"></small></span>
            <input type="checkbox" id="clipboard" class="switch">
          </label>
        </div>
      </section>

      <!-- Modes, the key's behaviour and the dictionary: settings-dictation.js. -->
      <section class="vs-sec">
        <h2><span data-icon="pencil"></span><span data-i18n="voice.settings.text"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" id="dictModeLabel" data-i18n="voice.settings.mode"></span>
          <div class="vs-field">
            <div class="seg" id="dictMode" role="radiogroup" aria-labelledby="dictModeLabel"></div>
            <div class="vs-hint" id="dictModeHint"></div>
            <div class="vs-err" data-err="dictationMode"></div>
          </div>

          <span class="vs-label" id="promptLangLabel" data-i18n="voice.settings.promptLanguage"></span>
          <div class="vs-field">
            <div class="seg" id="promptLang" role="radiogroup" aria-labelledby="promptLangLabel"></div>
            <div class="vs-err" data-err="promptLanguage"></div>
          </div>
        </div>
      </section>

      <section class="vs-sec">
        <h2><span data-icon="keyboard"></span><span data-i18n="voice.settings.hotkeys"></span></h2>
        <div class="vs-grid">
          <label class="vs-label" for="hkDictate" data-i18n="voice.settings.hotkey.dictate"></label>
          <div class="vs-field">
            <div class="vs-hk">
              <label class="hk" for="hkDictate">
                <input id="hkDictate" type="text" spellcheck="false" autocomplete="off">
                <span class="hk-caps" aria-hidden="true"></span>
                <span class="hk-rec" data-i18n="voice.settings.hotkey.recording"></span>
              </label>
              <button type="button" class="icon-btn" data-reset="dictate" data-i18n-title="voice.settings.hotkey.reset"></button>
            </div>
            <div class="vs-err" data-err="hotkeys.dictate"></div>
          </div>

          <span class="vs-label" id="talkModeLabel" data-i18n="voice.settings.talk"></span>
          <div class="vs-field">
            <div class="seg" id="talkMode" role="radiogroup" aria-labelledby="talkModeLabel"></div>
            <div class="vs-hint" id="talkModeHint"></div>
            <div class="vs-err" data-err="pushToTalk"></div>
          </div>

          <span></span>
          <div class="vs-hint" data-i18n="voice.settings.hotkey.hint"></div>
        </div>
      </section>
    </div>

    <div class="vs-pane" id="dictionary" data-group="voice" role="tabpanel" aria-labelledby="tabDictionary">
      <section class="vs-sec">
        <h2><span data-icon="book"></span><span data-i18n="settings.dictionary"></span></h2>
        <div class="vs-grid">
          <label class="vs-label" for="termInput" data-i18n="voice.settings.dict.terms"></label>
          <div class="vs-field">
            <div class="vd-terms" id="terms"><input id="termInput" type="text" spellcheck="false" autocomplete="off" maxlength="400"></div>
            <div class="vs-hint" data-i18n="voice.settings.dict.termsHint"></div>
            <div class="vs-err" data-err="dictionary.terms"></div>
          </div>

          <span class="vs-label" data-i18n="voice.settings.dict.replacements"></span>
          <div class="vs-field">
            <div class="vd-reps" id="reps" hidden></div>
            <button type="button" class="vd-add" id="repAdd"></button>
            <div class="vs-hint" data-i18n="voice.settings.dict.replacementsHint"></div>
            <div class="vs-err" data-err="dictionary.replacements"></div>
          </div>

          <span class="vs-label" data-i18n="voice.settings.dict.projects"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="dictProjects">
              <span><b data-i18n="voice.settings.dict.projectsToggle"></b><small id="dictProjectsCount"></small></span>
              <input type="checkbox" id="dictProjects" class="switch">
            </label>
            <div class="vs-hint" id="dictProjectsHint"></div>
          </div>
        </div>
        <p class="vs-hint vs-privacy" data-i18n="voice.settings.dict.privacy"></p>
      </section>
    </div>

    <div class="vs-pane" id="readaloud" data-group="voice" role="tabpanel" aria-labelledby="tabReadAloud">
      <section class="vs-sec">
        <h2><span data-icon="speaker"></span><span data-i18n="voice.settings.readAloud"></span></h2>
        <div class="vs-grid">
          <label class="vs-label" for="raModel" data-i18n="voice.settings.raModel"></label>
          <select id="raModel" class="select"></select>

          <label class="vs-label" for="raVoice" data-i18n="voice.settings.raVoice"></label>
          <div class="vs-field"><select id="raVoice" class="select"></select><div class="vs-hint" id="raHint"></div></div>

          <label class="vs-label" for="hkRead" data-i18n="voice.settings.hotkey.readAloud"></label>
          <div class="vs-field">
            <div class="vs-hk">
              <label class="hk" for="hkRead">
                <input id="hkRead" type="text" spellcheck="false" autocomplete="off">
                <span class="hk-caps" aria-hidden="true"></span>
                <span class="hk-rec" data-i18n="voice.settings.hotkey.recording"></span>
              </label>
              <button type="button" class="icon-btn" data-reset="readAloud" data-i18n-title="voice.settings.hotkey.reset"></button>
            </div>
            <div class="vs-err" data-err="hotkeys.readAloud"></div>
          </div>

          <span></span>
          <div class="vs-hint" data-i18n="voice.settings.hotkey.hint"></div>
        </div>
      </section>
    </div>

    <!-- Voice commands: applied at once; built by settings-commands.js. -->
    <div class="vs-pane" id="commands" role="tabpanel" aria-labelledby="tabCommands"></div>

    <!-- Network: the proxy, saved with its own Save/Cancel. Rows with data-show belong to those modes only. -->
    <div class="vs-pane" id="network" role="tabpanel" aria-labelledby="tabNetwork">
      <section class="vs-sec">
        <h2><span data-icon="globe"></span><span data-i18n="settings.network.proxy"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" id="netModeLabel" data-i18n="settings.network.mode"></span>
          <div class="vs-field">
            <div class="seg vs-netmode" id="netMode" role="radiogroup" aria-labelledby="netModeLabel"></div>
            <div class="vs-hint" id="netModeHint"></div>
          </div>

          <label class="vs-label" for="netPac" data-i18n="settings.network.pacUrl" data-show="pac"></label>
          <div class="vs-field" data-show="pac">
            <input id="netPac" class="input mono" type="text" spellcheck="false" autocomplete="off" placeholder="http://wpad.corp.local/proxy.pac">
            <div class="vs-err" data-err="net.pacUrl"></div>
          </div>

          <label class="vs-label" for="netProxy" data-i18n="settings.network.server" data-show="manual"></label>
          <div class="vs-field" data-show="manual">
            <input id="netProxy" class="input mono" type="text" spellcheck="false" autocomplete="off" placeholder="http://proxy.corp.local:8080">
            <div class="vs-err" data-err="net.proxy"></div>
          </div>

          <label class="vs-label" for="netBypass" data-i18n="settings.network.bypass" data-show="manual"></label>
          <div class="vs-field" data-show="manual">
            <input id="netBypass" class="input mono" type="text" spellcheck="false" autocomplete="off" placeholder="&lt;local&gt;, *.corp.local">
            <div class="vs-hint" data-i18n="settings.network.bypassHint"></div>
            <div class="vs-err" data-err="net.bypass"></div>
          </div>

          <label class="vs-label" for="netUser" data-i18n="settings.network.username" data-show="system pac manual"></label>
          <div class="vs-field" data-show="system pac manual">
            <input id="netUser" class="input" type="text" spellcheck="false" autocomplete="off">
            <div class="vs-hint" data-i18n="settings.network.signInHint"></div>
            <div class="vs-err" data-err="net.username"></div>
          </div>

          <label class="vs-label" for="netPass" data-i18n="settings.network.password" data-show="system pac manual"></label>
          <div class="vs-field" data-show="system pac manual">
            <div class="vs-key">
              <input id="netPass" class="input" type="password" spellcheck="false" autocomplete="new-password">
              <span class="tag" id="netPassTag"></span>
            </div>
            <div class="vs-keystate" id="netPassState"></div>
            <div class="vs-err" data-err="net.password"></div>
          </div>

          <span class="vs-label" data-i18n="settings.network.check"></span>
          <div class="vs-field">
            <div class="vs-test">
              <span class="tag" id="netTestTag"></span>
              <span class="grow"></span>
              <button type="button" class="btn sm" id="netTest"><span data-icon="pulse"></span><span data-i18n="settings.network.test"></span></button>
            </div>
            <div class="vs-hint" id="netTestHint" role="status"></div>
          </div>
        </div>
      </section>

      <section class="vs-sec" data-show="system pac manual">
        <h2><span data-icon="terminal"></span><span data-i18n="settings.network.terminals"></span></h2>
        <div class="vs-grid">
          <span class="vs-label" data-i18n="settings.network.terminals.label"></span>
          <div class="vs-field">
            <label class="vs-toggle" for="netTerminals">
              <span><b data-i18n="settings.network.terminals.toggle"></b></span>
              <input type="checkbox" id="netTerminals" class="switch">
            </label>
            <div class="vs-hint" data-i18n="settings.network.terminals.hint"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <footer class="vs-foot">
    <div class="vs-note" data-for="general" data-i18n="settings.general.applied"></div>
    <div class="vs-note" data-for="commands" data-i18n="settings.general.applied"></div>
    <div class="vs-err vs-form-err" data-for="voice" data-err="form"></div>
    <div class="vs-err vs-form-err" data-for="network" data-err="net.form"></div>
    <button type="button" class="btn" id="close" data-for="general" data-i18n="common.close"></button>
    <button type="button" class="btn" id="cmdClose" data-for="commands" data-i18n="common.close"></button>
    <button type="button" class="btn" id="cancel" data-for="voice" data-i18n="common.cancel"></button>
    <button type="submit" class="btn primary" id="save" data-for="voice" data-i18n="voice.settings.save"></button>
    <button type="button" class="btn" id="netCancel" data-for="network" data-i18n="common.cancel"></button>
    <button type="submit" class="btn primary" id="netSave" data-for="network" data-i18n="voice.settings.save"></button>
  </footer>
  </div>
</form>
<script src="../../common.js"></script>
<script src="settings-dictation.js"></script>
<script src="settings-commands.js"></script>
<script src="settings.js"></script>
</body>
</html>
