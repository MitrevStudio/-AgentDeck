<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>AgentDeck</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="bar.css">
<link rel="stylesheet" href="usage.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="git.css">
<link rel="stylesheet" href="bar-voice.css">
<script src="i18n.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <div class="top">
    <div class="logo">⌘</div>
    <div class="search">
      <span data-icon="search"></span>
      <input id="q" type="search" data-i18n-placeholder="bar.search.placeholder" data-i18n-aria-label="common.search" autocomplete="off" spellcheck="false">
    </div>
    <div id="limits"></div>
    <div id="liveSum"></div>
    <button class="icon-btn voice-cmd" id="voiceCmd" hidden><span data-icon="mic"></span></button>
    <button class="icon-btn hide-toggle" id="hiddenToggle"></button>
    <button class="icon-btn" id="refreshBtn" data-i18n-title="manager.refresh.title"><span data-icon="refresh"></span></button>
    <button class="icon-btn" id="openManager" data-i18n-title="common.openManager"><span data-icon="window"></span></button>
  </div>
  <div class="strip-wrap">
    <button class="nav left" id="navL" data-i18n-title="bar.nav.back"><span data-icon="left"></span></button>
    <div class="strip" id="strip"></div>
    <button class="nav right" id="navR" data-i18n-title="bar.nav.forward"><span data-icon="right"></span></button>
  </div>
  <div class="detail" id="detail"></div>
  <div class="keys"><kbd>↑</kbd><kbd>↓</kbd><span data-i18n="bar.keys.session"></span><kbd>←</kbd><kbd>→</kbd><span data-i18n="bar.keys.project"></span><kbd>Enter</kbd><span data-i18n="bar.keys.open"></span><kbd>Esc</kbd><span data-i18n="bar.keys.close"></span><span class="grow"></span><span id="hotkey"></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="common.js"></script>
<script src="usage-ui.js"></script>
<script src="git-ui.js"></script>
<script src="preview-ui.js"></script>
<script src="limits-ui.js"></script>
<script src="day-ui.js"></script>
<script src="bar.js"></script>
<script src="bar-voice.js"></script>
</body>
</html>
