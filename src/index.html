<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentDeck</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="usage.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="git.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="terminals.css">
<script src="i18n.js"></script>
</head>
<body>
<main>
  <!-- The sidebar, as in Herdr: the projects (each a space with its own tabs) and the agents running now. -->
  <aside class="side">
    <div class="side-head">
      <div class="logo">⌘</div>
      <!-- One quiet row of icons: the search is a popup (palette-ui.js), not a field, so it needs no field of its own. -->
      <span class="side-tools">
        <button id="openPalette" class="icon-btn" data-i18n-title="palette.open"><span data-icon="search"></span></button>
        <button id="usage" class="icon-btn" data-i18n-title="usage.button.title" aria-pressed="false"><span data-icon="chart"></span></button>
        <button id="voiceHistory" class="icon-btn" data-i18n-title="manager.history.title"><span data-icon="clock"></span></button>
        <button id="settings" class="icon-btn" data-i18n-title="manager.settings.title"><span data-icon="sliders"></span></button>
        <button id="keysBtn" class="icon-btn" data-i18n-title="keys.open"><span data-icon="keyboard"></span></button>
      </span>
    </div>
    <div class="side-body">
      <section class="side-sec centre-sec"><div id="centre"></div></section>
      <section class="side-sec projects-sec">
        <div class="side-sec-head"><h2 data-i18n="manager.projects"></h2><span class="count" id="projectCount">0</span>
          <span class="side-tools">
            <button class="icon-btn" id="projectOrder" hidden></button>
            <button class="icon-btn" id="newGroup" hidden data-i18n-title="manager.projectGroup.addTitle"><span data-icon="groupAdd"></span></button>
            <button class="icon-btn" id="add" data-i18n-title="manager.addProject"><span data-icon="plus"></span></button>
          </span></div>
        <div class="side-list" id="projects"></div>
      </section>
      <section class="side-sec agents-sec">
        <div class="side-sec-head"><h2 data-i18n="manager.agents.title"></h2><span class="count" id="agentCount">0</span></div>
        <div class="side-list" id="agents"></div>
      </section>
    </div>
  </aside>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="manager.splitter"></div>
  <!-- The shown project's tabs, and the shown tab split into panes (workspace-ui.js). -->
  <section class="work">
    <div class="tabbar" id="tabbar" role="tablist"></div>
    <div class="panes" id="panes" hidden></div>
    <div class="space-empty" id="spaceEmpty"></div>
  </section>
</main>
<section id="usageView" class="usage-view" tabindex="-1" data-i18n-aria-label="usage.title" hidden></section>
<!-- Search (palette-ui.js). -->
<div class="pal-back" id="palette" hidden>
  <div class="pal" role="dialog" data-i18n-aria-label="palette.title">
    <div class="pal-head"><span data-icon="search"></span><input id="palQ" type="search" data-i18n-placeholder="manager.search.placeholder" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
    <div class="pal-body"><div class="pal-list" id="palList"></div><aside class="pv pal-pv" id="palPv" hidden></aside></div>
    <div class="pal-foot"><kbd>↑</kbd><kbd>↓</kbd><span data-i18n="manager.keys.select"></span><kbd>Enter</kbd><span data-i18n="palette.keys.open"></span><kbd>Alt</kbd><kbd>Enter</kbd><span data-i18n="palette.keys.beside"></span></div>
  </div>
</div>
<!-- The window's keyboard shortcuts (F1, keys-ui.js). -->
<div class="pal-back" id="keysPanel" hidden>
  <div class="pal keys-pal" role="dialog" data-i18n-aria-label="keys.title">
    <div class="pal-head"><span data-icon="keyboard"></span><b data-i18n="keys.title"></b><kbd>Esc</kbd></div>
    <div class="keys-list" id="keysList"></div>
  </div>
</div>
<footer class="status">
  <span id="focusInfo" class="focus-info"></span>
  <span id="status" data-i18n="manager.status.ready"></span>
  <div id="limits"></div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="common.js"></script>
<script src="usage-ui.js"></script>
<script src="git-ui.js"></script>
<script src="preview-ui.js"></script>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="workspace-ui.js"></script>
<script src="renderer.js"></script>
<script src="palette-ui.js"></script>
<script src="limits-ui.js"></script>
<script src="usage-view.js"></script>
<script src="keys-ui.js"></script>
</body>
</html>
